# Full local stack: PostgreSQL + Ollama (Qwen) + FastAPI RAG + Express Web.
# HTTP only for localhost development. Production (TLS, Caddy, immutable images):
# deploy/PRODUCTION.md and compose.production.yml.
#
#   cp .env.docker.example .env.docker   # fill secrets, then:
#   docker compose --env-file .env.docker -f compose.local.yml up -d --build
#
# Runtime data (artifacts, crawl DB, HF cache, web catalog) is bind-mounted from ./var,
# so rebuilding containers never destroys indexed data or user/enrollment rows.
name: itlr-local

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.docker}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  ollama:
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      HF_HOME: /app/var/hf
      USE_OLLAMA: "1"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-240}
      DISABLE_RERANKER: ${DISABLE_RERANKER:-1}
      ITLR_REQUIRE_ARTIFACT_MANIFEST: "1"
      ITLR_ADMIN_TOKEN: ${ITLR_ADMIN_TOKEN:-}
      WEB_CONCURRENCY: "1"
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-4}
      OPENBLAS_NUM_THREADS: "1"
      DEEPSEEK_API_KEY: ""
      OPENAI_API_KEY: ""
    volumes:
      - ./var:/app/var
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    stop_grace_period: 45s
    depends_on:
      ollama:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      PORT: "3000"
      WEB_CONCURRENCY: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET >=32 chars in .env.docker}
      ADMIN_PASSCODE: ${ADMIN_PASSCODE:?set ADMIN_PASSCODE >=16 chars in .env.docker}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      RECOMMENDER_URL: http://api:8000
      ITEMS_CSV: /app/var/data/web_items.csv
      TRUSTED_PROXIES: ""
      SMTP_HOST: ""
      SMTP_USER: ""
      SMTP_PASS: ""
    volumes:
      - ./var/data:/app/var/data
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  pgdata: null
  ollama_models: null
