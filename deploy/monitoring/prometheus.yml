global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    stack: itlr-local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: itlr-api
    metrics_path: /metrics/prometheus
    authorization:
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["api:8000"]
  - job_name: itlr-web
    metrics_path: /metrics
    authorization:
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["web:3000"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
