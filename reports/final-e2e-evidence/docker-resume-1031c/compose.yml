name: itlr-resume-1031b

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    env_file: ./postgres.env
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 384m
    cpus: 1
  ollama:
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: 'true'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '4096'
    volumes:
    - ollama_private:/root/.ollama
    - /usr/share/ollama/.ollama/models:/root/.ollama/models:ro
    mem_limit: 3500m
    cpus: 4
  api:
    image: itlr-resume-1031b-api:stage
    build:
      context: /home/o/ITLR--RAG
      dockerfile: /tmp/opencode/itlr-docker-fresh/Dockerfile.cpu
    init: true
    env_file: ./api.env
    environment:
      WEB_CONCURRENCY: '1'
      ITLR_REQUIRE_ARTIFACT_MANIFEST: '1'
      HF_HOME: /app/var/hf
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      USE_OLLAMA: '1'
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_BASE_URL: http://observer:18435
      OLLAMA_TIMEOUT: '45'
      DISABLE_RERANKER: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      DEEPSEEK_API_KEY: ''
      OPENAI_API_KEY: ''
    ports:
    - 127.0.0.1:19081:8000
    volumes:
    - /tmp/itlr-local-final/docker/artifacts:/app/var/artifacts
    - /home/o/ITLR--RAG/var/hf:/app/var/hf:ro
    mem_limit: 4g
    cpus: 2
    stop_grace_period: 45s
  web:
    image: itlr-resume-1031b-web:stage
    build:
      context: /home/o/ITLR--RAG/web
    init: true
    env_file: ./web.env
    environment:
      NODE_ENV: production
      PORT: '3000'
      WEB_CONCURRENCY: '1'
      TRUSTED_PROXIES: 172.29.234.10
      RECOMMENDER_URL: http://api:8000
      ITEMS_CSV: /app/var/data/web_items.csv
      DEEPSEEK_API_KEY: ''
      OPENAI_API_KEY: ''
    volumes:
    - ./web-data:/app/var/data
    stop_grace_period: 30s
    mem_limit: 384m
    cpus: 1
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
    - 127.0.0.1:19444:443
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
    mem_limit: 128m
    cpus: 1
    networks:
      default:
        ipv4_address: 172.29.234.10
    depends_on:
      web:
        condition: service_healthy
  observer:
    image: itlr-resume-1031b-api:stage
    entrypoint:
    - python
    - /observer.py
    volumes:
    - ./observer.py:/observer.py:ro
    - ./observer-evidence:/evidence
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      ollama:
        condition: service_started
    init: true
networks:
  default:
    ipam:
      config:
      - subnet: 172.29.234.0/24
volumes:
  postgres_data: null
  ollama_private: null
  caddy_data: null
  caddy_config: null
