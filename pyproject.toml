[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itlr-rag"
version = "1.0.0"
description = "IT Learning Recommender — RAG (E5/BGE + BM25/TF-IDF + ANN + Cross-Encoder) · CF gợi ý cá nhân · Chatbot sinh câu trả lời bằng DeepSeek/OpenAI/Ollama · API FastAPI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ITLR maintainers" }]
keywords = ["rag", "recommender", "collaborative-filtering", "fastapi", "deepseek"]

dependencies = [
    # Web API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Thu thập dữ liệu (crawler V2)
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    # Dữ liệu
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyarrow>=15",          # cần để unpickle item_list.pkl (dtype Arrow-backed)
    # Truy hồi ngữ nghĩa + reranker
    "sentence-transformers>=3.0",
    # ANN (tùy chọn runtime — thiếu sẽ tự fallback brute-force, nhưng khuyến nghị cài)
    "faiss-cpu>=1.8",
    # LLM client
    "openai>=1.40",
    "nltk>=3.8",
    "tqdm>=4.66",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Đánh giá / LTR / biểu đồ (cần khi chạy eval/*)
eval = ["lightgbm>=4.0", "matplotlib>=3.8", "shap>=0.46"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
namespaces = false
include = ["itlr*"]

[tool.setuptools.package-data]
"itlr.api" = ["static/*.html", "static/*.js", "static/*.css"]
